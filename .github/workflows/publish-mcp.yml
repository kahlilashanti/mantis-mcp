name: Publish to npm and MCP Registry

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Publish to npm first (required before MCP Registry can validate)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build package
        run: npm run build:cli

      - name: Publish to npm (using Trusted Publishing OIDC)
        run: npm publish --access public

      # Publish to MCP Registry
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Report Success
        if: success()
        run: |
          echo "✅ Successfully published ${{ github.ref_name }}"
          echo "📦 npm: https://www.npmjs.com/package/mantis-mcp"
          echo "🔧 MCP Registry: https://registry.modelcontextprotocol.io"

      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Publishing failed for ${{ github.ref_name }}"
          echo "Check the logs above for details"
          exit 1

name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install mcp-publisher
        run: npm install -g @modelcontextprotocol/publisher

      - name: Publish to MCP Registry
        run: mcp-publisher publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Success
        if: success()
        run: |
          echo "Successfully published ${{ github.ref_name }} to MCP Registry"
          echo "Registry listing will update shortly at https://registry.modelcontextprotocol.io"

      - name: Report Failure
        if: failure()
        run: |
          echo "Failed to publish to MCP Registry"
          echo "Check the logs above for details"
          exit 1
